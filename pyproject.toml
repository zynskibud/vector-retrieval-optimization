[project]
name = "vector-retrieval-optimization"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1; sys_platform == 'darwin'",
    "faiss-cpu==1.12.0; sys_platform == 'linux'",  # last version with a Linux arm64 wheel
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
    "qdrant-client>=1.19",
    "psycopg[binary]>=3.3",
    "pymilvus>=3.0",
    "sentence-transformers>=3",
    "torch>=2.8",  # listed so [tool.uv.sources] can point Linux at the CPU wheels
    "redis>=5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# CPU-only torch on Linux (the container): the embedding cache (Phase 6) runs the model on CPU,
# and the default Linux aarch64 torch wheel pulls about 3 GB of CUDA packages.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
