[package]
name = "bench"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "bench"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
libc = "0.2"

[profile.release]
opt-level = 3
codegen-units = 1
