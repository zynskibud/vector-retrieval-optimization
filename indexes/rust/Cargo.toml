[package]
name = "bench"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "bench"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
libc = "0.2"

[lints.clippy]
# Style lints added in clippy 0.1.98 (the container's toolchain); the code is correct as written.
chunks_exact_to_as_chunks = "allow"
manual_clear = "allow"
too_many_arguments = "allow"

[profile.release]
opt-level = 3
codegen-units = 1
