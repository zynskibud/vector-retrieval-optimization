# Isolated benchmark environment. Everything that builds, tests, or benchmarks
# runs here, never on the host. See "Isolation" in CLAUDE.md and the Makefile.
#
#   make setup    one-time: build the image, install deps, build all four languages
#   make test     all test suites
#   make bench ARGS="--languages rust --indexes flat"
#
# The repository is read-only inside the container. Writable places:
#   results/summary/   bind mount, the only host path the container can change
#   results/raw, /scratch  named volumes (Linux ext4, so O_DIRECT works for DiskANN); TMPDIR=/scratch
#   build outputs      named volumes over .venv and the indexes/*/ build dirs
#   caches             named volumes for uv, cargo, go

x-bench: &bench
  image: vro-bench:latest
  pull_policy: never    # built locally by `make image`; never pulled
  working_dir: /work
  volumes:
    - .:/work:ro
    - ./results/summary:/work/results/summary
    - raw:/work/results/raw
    - scratch:/scratch
    - venv:/work/.venv
    - rust-target:/work/indexes/rust/target
    - cpp-build:/work/indexes/cpp/build
    - go-bin:/work/indexes/go/bin
    - uv-cache:/root/.cache/uv
    - cargo-registry:/usr/local/cargo/registry
    - go-cache:/root/.cache/go-build
    - go-mod:/root/go
    - hf-cache:/root/.cache/huggingface   # Phase 6: the embedding model, downloaded once by setup
  environment:
    TMPDIR: /scratch    # disk-backed (ext4 on the VM disk): DiskANN test files need real O_DIRECT reads, not tmpfs
    VRO_THREADS: "${VRO_CPUS:-3}"    # build threads for the benches; the same number as `cpus` below
  tmpfs:
    - /tmp:size=1g
  # Two caps, fixed by the coordinator protocol (../.coord/PROTOCOL.md). The file's defaults are the
  # day cap: one container at a time, 3 CPUs, 6 GB. A TIMING job started by scripts/run.sh on the
  # coordinator's GO exports VRO_CPUS=6 VRO_MEM=12g. Nothing else sets these variables.
  cpus: ${VRO_CPUS:-3}
  mem_limit: ${VRO_MEM:-6g}
  pids_limit: 512
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # No network: builds, tests, benchmarks.
  bench:
    <<: *bench
    build: .            # only this service builds the image; setup reuses it
    network_mode: none
    profiles: [tools]   # so `docker compose --profile <db> up` never starts this one-shot service (run still works)

  # Network on, for the one-time dependency downloads (uv sync, cargo fetch).
  setup:
    <<: *bench
    profiles: [tools]

  # Phase 2: the same bench image on the internal database network. No external
  # access (the network is internal). Runs tools.db.bench against one database.
  dbbench:
    <<: *bench
    profiles: [db]
    networks: [dbnet]

  # Phase 2 databases. One at a time. Each under a profile, so `make test` and the
  # sweeps never start them. Data in named volumes, so backup/restore (Phase 7)
  # can inspect them. Caps: 3 CPUs by day, 4 in a TIMING job (VRO_DB_CPUS, set by
  # scripts/run.sh); 4 GB now, 8 GB for the full-corpus runs.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    profiles: [qdrant, db]
    networks: [dbnet]
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    cpus: ${VRO_DB_CPUS:-3}
    mem_limit: 4g

  pgvector:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    profiles: [pgvector, db]
    networks: [dbnet]
    environment:
      POSTGRES_USER: vro
      POSTGRES_PASSWORD: vro
      POSTGRES_DB: vro
    command: >
      postgres -c shared_buffers=1GB -c maintenance_work_mem=1GB
               -c max_parallel_maintenance_workers=4 -c max_parallel_workers=4
               -c max_wal_size=2GB
    volumes:
      - pg-data:/var/lib/postgresql/data
    # A parallel index build keeps maintenance_work_mem (1GB) in dynamic shared
    # memory under /dev/shm; Docker's default 64 MB fails with DiskFull.
    shm_size: 1536m
    cpus: ${VRO_DB_CPUS:-3}
    mem_limit: 4g

  # Milvus standalone with embedded etcd and local file storage (no etcd or
  # MinIO containers), the way Milvus's own standalone_embed.sh runs it.
  milvus:
    image: milvusdb/milvus:v3.0.2
    profiles: [milvus, db]
    networks: [dbnet]
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    volumes:
      - milvus-data:/var/lib/milvus
      - ./tools/db/milvus-config/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ./tools/db/milvus-config/user.yaml:/milvus/configs/user.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    cpus: ${VRO_DB_CPUS:-3}
    mem_limit: 4g

  # Phase 6: Redis as the shared embedding cache.
  redis:
    image: redis:7-alpine
    profiles: [cache, db]
    networks: [dbnet]
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save ""
    mem_limit: 768m

networks:
  dbnet:
    internal: true      # containers on it reach each other and nothing outside

volumes:
  qdrant-data:
  qdrant-snapshots:
  pg-data:
  milvus-data:
  raw:
  scratch:
  venv:
  rust-target:
  cpp-build:
  go-bin:
  uv-cache:
  cargo-registry:
  go-cache:
  go-mod:
  hf-cache:
